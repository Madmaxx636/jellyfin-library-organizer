<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Library Organizer</title></head>
<body>
<div id="OrganizerPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox,emby-select">
  <div data-role="content">
    <div class="content-primary">
      <h1>Library Organizer</h1>
      <p>Each rule builds one collection. Lists are comma separated. Genres, tags, countries and studios
      match exactly (case-insensitive); title keywords match anywhere in the title.</p>
      <form id="OrganizerForm">
        <div class="checkboxContainer checkboxContainer-withDescription">
          <label class="emby-checkbox-label"><input is="emby-checkbox" type="checkbox" id="removeNonMatching" /><span>Remove items that stop matching</span></label>
        </div>
        <div class="inputContainer">
          <label class="inputLabel inputLabelUnfocused" for="minItems">Minimum items for a collection</label>
          <input is="emby-input" type="number" id="minItems" min="1" />
        </div>
        <div class="inputContainer">
          <label class="inputLabel inputLabelUnfocused" for="homeRowLimit">Items per home screen row (requires the Home Screen Sections plugin)</label>
          <input is="emby-input" type="number" id="homeRowLimit" min="1" />
        </div>
        <div id="rules"></div>
        <button is="emby-button" type="button" class="raised" id="addRule"><span>Add rule</span></button>
        <button is="emby-button" type="submit" class="raised button-submit block"><span>Save</span></button>
      </form>
    </div>
  </div>
  <script type="text/javascript">
    (function () {
      var pluginId = '6f1c2a54-3b7e-4d0a-9a51-2c8e7d4b1f90';
      var page = document.querySelector('#OrganizerPage');
      var cfg = null;
      var fields = [
        ['Genres', 'Genres'], ['Tags', 'Tags'], ['Countries', 'Countries (production)'],
        ['Studios', 'Studios'], ['TitleKeywords', 'Title keywords'], ['OfficialRatings', 'Official ratings']
      ];

      function el(html) { var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
      function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
      function sel(id, opts, cur) {
        return '<select data-k="' + id + '">' + opts.map(function (o) {
          return '<option value="' + o + '"' + (o === cur ? ' selected' : '') + '>' + o + '</option>';
        }).join('') + '</select>';
      }

      function renderRule(r) {
        var h = '<fieldset class="rule" style="margin:1.5em 0;padding:1em;border:1px solid #555;">' +
          '<label><input type="checkbox" data-k="Enabled"' + (r.Enabled ? ' checked' : '') + '> Enabled</label> ' +
          '<button type="button" class="del" style="float:right">Delete</button><br><br>' +
          '<label>Collection name<br><input type="text" data-k="Name" value="' + esc(r.Name) + '" style="width:100%"></label><br><br>' +
          '<label>Media type ' + sel('MediaType', ['Movie', 'Series', 'Both'], r.MediaType) + '</label> ' +
          '<label>Combine fields ' + sel('Match', ['Any', 'All'], r.Match) + '</label> ' +
          '<label><input type="checkbox" data-k="ShowOnHome"' + (r.ShowOnHome ? ' checked' : '') + '> Show on home screen</label> ' +
          '<label>Item order ' + sel('ItemOrder', ['PremiereDate', 'SortName'], r.ItemOrder) + '</label><br><br>';
        fields.forEach(function (f) {
          h += '<label>' + f[1] + '<br><input type="text" data-list="' + f[0] + '" value="' + esc((r[f[0]] || []).join(', ')) + '" style="width:100%"></label><br>';
        });
        h += '<br><label>Year from <input type="number" data-num="YearFrom" value="' + esc(r.YearFrom) + '" style="width:6em"></label> ' +
          '<label>to <input type="number" data-num="YearTo" value="' + esc(r.YearTo) + '" style="width:6em"></label> ' +
          '<label>Min rating <input type="number" step="0.1" data-num="MinCommunityRating" value="' + esc(r.MinCommunityRating) + '" style="width:5em"></label> ' +
          '<label>Position <input type="number" data-num="Position" value="' + esc(r.Position) + '" style="width:5em"></label>' +
          '</fieldset>';
        var node = el(h);
        node.querySelector('.del').onclick = function () { node.remove(); };
        return node;
      }

      function readRules() {
        return Array.prototype.map.call(page.querySelectorAll('.rule'), function (n) {
          var r = {};
          n.querySelectorAll('[data-k]').forEach(function (i) {
            r[i.dataset.k] = i.type === 'checkbox' ? i.checked : i.value;
          });
          n.querySelectorAll('[data-list]').forEach(function (i) {
            r[i.dataset.list] = i.value.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
          });
          n.querySelectorAll('[data-num]').forEach(function (i) {
            r[i.dataset.num] = i.value === '' ? null : Number(i.value);
          });
          r.Position = r.Position || 0;
          return r;
        });
      }

      page.addEventListener('pageshow', function () {
        Dashboard.showLoadingMsg();
        ApiClient.getPluginConfiguration(pluginId).then(function (c) {
          cfg = c;
          page.querySelector('#removeNonMatching').checked = c.RemoveNonMatching;
          page.querySelector('#minItems').value = c.MinItems;
          page.querySelector('#homeRowLimit').value = c.HomeRowLimit;
          var box = page.querySelector('#rules'); box.innerHTML = '';
          (c.Rules || []).forEach(function (r) { box.appendChild(renderRule(r)); });
          Dashboard.hideLoadingMsg();
        });
      });

      page.querySelector('#addRule').onclick = function () {
        page.querySelector('#rules').appendChild(renderRule({ Enabled: true, Name: '', MediaType: 'Movie', Match: 'Any', ItemOrder: 'PremiereDate', ShowOnHome: true, Position: 0 }));
      };

      page.querySelector('#OrganizerForm').addEventListener('submit', function (e) {
        e.preventDefault();
        Dashboard.showLoadingMsg();
        cfg.RemoveNonMatching = page.querySelector('#removeNonMatching').checked;
        cfg.MinItems = Number(page.querySelector('#minItems').value) || 1;
        cfg.HomeRowLimit = Number(page.querySelector('#homeRowLimit').value) || 16;
        cfg.Rules = readRules();
        ApiClient.updatePluginConfiguration(pluginId, cfg).then(Dashboard.processPluginConfigurationUpdateResult);
      });
    })();
  </script>
</div>
</body>
</html>
